<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>LKS Dialer</title>
    <style>
      /* Splash Screen Styles */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100dvh;
        background-color: #121212;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        background-color: #00E676; /* Green */
        border-radius: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 6px 6px 0px #00C853; /* Neo-brutalism shadow */
        animation: pulseLogo 1.5s infinite alternate;
        margin-bottom: 24px;
        border: 3px solid #000;
      }
      .splash-logo svg {
        width: 40px;
        height: 40px;
        fill: none;
        stroke: #121212;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .splash-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 800;
        font-size: 28px;
        color: #FFFFFF;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 3px 3px 0px rgba(0,0,0,0.5);
      }
      @keyframes pulseLogo {
        0% { transform: scale(0.95); box-shadow: 4px 4px 0px #00C853; }
        100% { transform: scale(1.05); box-shadow: 8px 8px 0px #00C853; }
      }
      .fade-out {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
      </div>
      <div class="splash-text">LKS Dialer</div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Automatically register service worker for PWA support (using our existing Firebase SW)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(console.error);
        });
      }
    </script>
  </body>
</html>
