<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>LKS Dialer</title>
    <style>
      /* Splash Screen Styles */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100dvh;
        background-color: #0D0A1A;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      .splash-logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 8px 32px rgba(124, 58, 237, 0.35);
        animation: pulseLogo 1.5s infinite alternate;
        margin-bottom: 24px;
        overflow: hidden;
      }
      .splash-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .splash-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 800;
        font-size: 28px;
        color: #FFFFFF;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 4px 12px rgba(0,0,0,0.6);
      }
      @keyframes pulseLogo {
        0% { transform: scale(0.95); box-shadow: 0 4px 16px rgba(124, 58, 237, 0.2); }
        100% { transform: scale(1.05); box-shadow: 0 12px 36px rgba(124, 58, 237, 0.5); }
      }
      .fade-out {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-logo">
        <img src="/icon.png" alt="LKS Dialer Logo" />
      </div>
      <div class="splash-text">LKS Dialer</div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Automatically register service worker for PWA support (using our existing Firebase SW)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(console.error);
        });
      }
    </script>
  </body>
</html>
